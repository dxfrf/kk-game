[package]
name = "kk-game"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.15"
bevy_egui = "0.31"
serde = { version = "1", features = ["derive"] }
ron = "0.8"
directories = "5"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
